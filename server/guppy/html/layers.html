<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layer Metadata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        form {
            margin-bottom: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input[type=text], input[type=checkbox] {
            margin-bottom: 10px;
            display: block;
            width: calc(100% - 22px);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            text-align: center;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 15px;
            margin-bottom: 2px;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .deleteButton {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 15px;
            text-align: center;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .deleteButton:hover {
            background-color: #cc0000;
        }

        .controls,
        .paginationControls {
            margin-bottom: 12px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .controls input[type=text] {
            width: 260px;
            margin-bottom: 0;
            display: inline-block;
        }

        .controls select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background: #fff;
        }

        .paginationControls button {
            margin-right: 0;
        }

        .pageInfo {
            color: #333;
            font-size: 14px;
        }
    </style>
</head>
<body>
<h1>Layer Metadata</h1>
<form id="addLayerForm">
    <input type="text" id="layer_name" name="layer_name" placeholder="Layer Name" required>
    <input type="text" id="label" name="label" placeholder="Layer Label" required>
    <input type="text" id="file_path" name="file_path" placeholder="File Path" required>
    <input type="text" id="data_path" name="data_path" placeholder="Data Path">
    <input type="text" id="metadata" name="metadata" placeholder="Metadata">
    <label>
        <input type="checkbox" id="is_rgb" name="is_rgb"> Is RGB
    </label>
    <label>
        <input type="checkbox" id="is_mbtile" name="is_mbtile"> Is MBTile
    </label>
    <br>
    <br>
    <button type="submit">Add Layer</button>
</form>

<div class="controls">
    <label for="nameFilter">Filter name:</label>
    <input type="text" id="nameFilter" placeholder="Type a layer name">
    <button type="button" id="applyFilterButton">Apply</button>
    <button type="button" id="clearFilterButton">Clear</button>

    <label for="pageSize">Rows per page:</label>
    <select id="pageSize">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
    </select>
</div>

<div class="paginationControls">
    <button type="button" id="prevPageButton">Previous</button>
    <span class="pageInfo" id="pageInfo">Page 1</span>
    <button type="button" id="nextPageButton">Next</button>
</div>

<div id="layersList"></div>

<script>
    document.getElementById('addLayerForm').onsubmit = async (e) => {
        e.preventDefault();
        const layerName = document.getElementById('layer_name').value;
        const label = document.getElementById('label').value;
        const filePath = document.getElementById('file_path').value;
        const dataPath = document.getElementById('data_path').value;
        const metadata = document.getElementById('metadata').value;
        const isRgb = document.getElementById('is_rgb').checked;
        const isMbtile = document.getElementById('is_mbtile').checked;

        const response = await fetch('$deploy_path$/admin/layer', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({layerName, label, filePath, dataPath, metadata, isRgb, isMbtile}),
        });

        if (response.ok) {
            console.log('Layer added');
            location.reload();
        } else {
            console.error('Error adding layer');
        }
    };

    const listState = {
        page: 1,
        pageSize: 25,
        nameFilter: '',
        hasNextPage: false,
        lastLoadedCount: 0,
    };

    function escapeSqlString(value) {
        return value.replace(/'/g, "''");
    }

    function buildLayerQueryUrl() {
        const params = new URLSearchParams();
        params.set('limit', String(listState.pageSize));
        params.set('offset', String((listState.page - 1) * listState.pageSize));

        if (listState.nameFilter) {
            const escapedFilter = escapeSqlString(listState.nameFilter);
            params.set('filter', `layer_name LIKE '%${escapedFilter}%'`);
        }

        return `$deploy_path$/layers?${params.toString()}`;
    }

    function updatePaginationControls() {
        const prevButton = document.getElementById('prevPageButton');
        const nextButton = document.getElementById('nextPageButton');
        const pageInfo = document.getElementById('pageInfo');
        const offsetStart = (listState.page - 1) * listState.pageSize + 1;

        if (listState.lastLoadedCount === 0) {
            pageInfo.textContent = `Page ${listState.page} - no results`;
        } else {
            const offsetEnd = offsetStart + listState.lastLoadedCount - 1;
            pageInfo.textContent = `Page ${listState.page} - showing ${offsetStart}-${offsetEnd}`;
        }

        prevButton.disabled = listState.page === 1;
        nextButton.disabled = !listState.hasNextPage;
    }

    async function loadLayers() {
        const response = await fetch(buildLayerQueryUrl());
        if (!response.ok) {
            console.error('Error loading layers');
            return;
        }

        const layers = await response.json();
        listState.lastLoadedCount = layers.length;
        listState.hasNextPage = layers.length === listState.pageSize;
        updatePaginationControls();

        const container = document.getElementById('layersList');
        container.innerHTML = '';
        const table = document.createElement('table');
        table.innerHTML = `
            <tr>
                <th>Name</th>
                <th>Label</th>
                <th>Path</th>
                <th>Data Path</th>
                <th>Metadata</th>
                <th>Is RGB</th>
                <th>Is MBTile</th>
                <th>Actions</th>
                <th>Stats</th>
            </tr>
        `;
        container.appendChild(table);

        layers.forEach(layer => {
            const row = table.insertRow(-1);

// Editable Name (optional: disable)
            const nameCell = row.insertCell(0);
            const nameText = document.createElement('span');
            nameText.innerHTML = layer.layerName.replace(/_/g, '_<wbr>');
            nameText.style.display = "inline-block";
            nameText.style.whiteSpace = "normal"; // allow wrapping now
            nameText.style.overflowWrap = "break-word";
            nameText.style.wordBreak = "break-all";   // breaks anywhere if needed
            nameText.style.overflow = "hidden";
            nameText.style.textOverflow = "ellipsis"; // will only apply for a single line, but remains harmless
            nameText.style.userSelect = "all";
            nameText.title = layer.layerName
            nameCell.appendChild(nameText);

            // Editable Label
            const labelCell = row.insertCell(1);
            const labelInput = document.createElement('input');
            labelInput.type = 'text';
            labelInput.value = layer.effectiveLabel || '';
            labelInput.title = labelInput.value
            labelCell.appendChild(labelInput);

            // Editable filePath
            const pathCell = row.insertCell(2);
            const filePathInput = document.createElement('input');
            filePathInput.type = 'text';
            filePathInput.value = layer.filePath || '';
            filePathInput.title = filePathInput.value
            pathCell.appendChild(filePathInput);

            // Editable dataPath
            const dataCell = row.insertCell(3);
            const dataPathInput = document.createElement('input');
            dataPathInput.type = 'text';
            dataPathInput.value = layer.dataPath || '';
            dataPathInput.title = dataPathInput.value;
            dataCell.appendChild(dataPathInput);

            // Editable metadata (as string)
            const metadataCell = row.insertCell(4);
            const metadataInput = document.createElement('input');
            metadataInput.type = 'text';
            // If metadata is an object, stringify, otherwise leave as is
            try {
                metadataInput.value = typeof layer.metadata === "object" && layer.metadata !== null ? JSON.stringify(layer.metadata) : (layer.metadata || "");
            } catch (e) {
                metadataInput.value = layer.metadata || "";
            }
            metadataInput.title = metadataInput.value;
            metadataCell.appendChild(metadataInput);

            // Editable isRgb
            const rgbCell = row.insertCell(5);
            const rgbCheckbox = document.createElement('input');
            rgbCheckbox.type = 'checkbox';
            rgbCheckbox.checked = layer.isRgb;
            rgbCell.appendChild(rgbCheckbox);

            // Editable isMbtile
            const mbtileCell = row.insertCell(6);
            const mbtileCheckbox = document.createElement('input');
            mbtileCheckbox.type = 'checkbox';
            mbtileCheckbox.checked = layer.isMbtile;
            mbtileCell.appendChild(mbtileCheckbox);

            // Action cell (Save / Delete)
            const actionCell = row.insertCell(7);
            // Save button
            const saveButton = document.createElement('button');
            saveButton.textContent = 'Save';
            saveButton.onclick = async () => {
                const putBody = {
                    layer_name: layer.layerName,
                    label: labelInput.value,
                    file_path: filePathInput.value,
                    data_path: dataPathInput.value,
                    metadata: metadataInput.value,
                    is_rgb: rgbCheckbox.checked,
                    is_mbtile: mbtileCheckbox.checked,
                };
                try {
                    const resp = await fetch(`$deploy_path$/admin/layer/${encodeURIComponent(putBody.layer_name)}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(putBody)
                    });
                    if (resp.ok) {
                        saveButton.textContent = "Saved!";
                        setTimeout(() => saveButton.textContent = "Save", 1500);
                    } else {
                        saveButton.textContent = "Error!";
                    }
                } catch (e) {
                    saveButton.textContent = "Error!";
                }
            };
            actionCell.appendChild(saveButton);

            // Delete button (as before)
            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.className = "deleteButton";
            deleteButton.onclick = async () => {
                try {
                    const response = await fetch(`$deploy_path$/admin/layer/${encodeURIComponent(layer.layerName)}`, {
                        method: 'DELETE',
                    });
                    if (response.ok) {
                        await loadLayers();
                    } else {
                        console.error('Failed to delete the layer');
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            };
            actionCell.appendChild(deleteButton);

            // Stats and Download (as before)
            const statsCell = row.insertCell(8);

            // Only show if MBTile
            if (mbtileCheckbox.checked) {
                const statsButton = document.createElement('button');
                statsButton.textContent = 'View Stats';
                statsButton.onclick = function () {
                    window.location.href = `$deploy_path$/admin/stats?layerName=${encodeURIComponent(layer.layerName)}`;
                };
                statsCell.appendChild(statsButton);

                const downloadButton = document.createElement('button');
                downloadButton.textContent = 'Download Stats';
                downloadButton.onclick = function () {
                    window.location.href = `$deploy_path$/admin/tilestatsgpkg?layerName=${encodeURIComponent(layer.layerName)}`;
                };
                statsCell.appendChild(downloadButton);
            }
        });
    }

    document.getElementById('applyFilterButton').onclick = async () => {
        listState.nameFilter = document.getElementById('nameFilter').value.trim();
        listState.page = 1;
        await loadLayers();
    };

    document.getElementById('clearFilterButton').onclick = async () => {
        document.getElementById('nameFilter').value = '';
        listState.nameFilter = '';
        listState.page = 1;
        await loadLayers();
    };

    document.getElementById('nameFilter').addEventListener('keydown', async (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            listState.nameFilter = document.getElementById('nameFilter').value.trim();
            listState.page = 1;
            await loadLayers();
        }
    });

    document.getElementById('pageSize').addEventListener('change', async (event) => {
        listState.pageSize = parseInt(event.target.value, 10);
        listState.page = 1;
        await loadLayers();
    });

    document.getElementById('prevPageButton').onclick = async () => {
        if (listState.page > 1) {
            listState.page -= 1;
            await loadLayers();
        }
    };

    document.getElementById('nextPageButton').onclick = async () => {
        listState.page += 1;
        await loadLayers();

        // If we stepped beyond last page (exact limit multiple edge case), bounce back.
        if (listState.lastLoadedCount === 0 && listState.page > 1) {
            listState.page -= 1;
            await loadLayers();
        }
    };

    loadLayers();
</script>
</body>
</html>
